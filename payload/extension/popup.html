<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{width:330px;padding:18px;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;margin:0;color:#1f2937}h1{font-size:18px;margin:0 0 12px}.info{font-size:13px;line-height:1.6;color:#4b5563;margin-bottom:12px}.section{margin:12px 0;padding:11px;background:#f3f4f6;border-radius:9px}.label{font-size:12px;color:#6b7280;margin-bottom:5px}.path{font-size:12px;line-height:1.45;word-break:break-all;color:#111827}.row{display:flex;gap:8px}.button{display:block;width:100%;padding:10px;margin-top:8px;background:linear-gradient(135deg,#1677ff,#6c4cff);color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}.button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#334155}.light{background:#64748b}.status{margin-top:12px;padding:10px;background:#f3f4f6;border-radius:8px;font-size:12px;line-height:1.5;white-space:pre-wrap}.ok{background:#ecfdf5;color:#047857}.bad{background:#fef2f2;color:#b91c1c}
</style></head><body>
<h1>yt-dlp Floating Downloader</h1>
<div class="info">支持抖音、B站、YouTube、小红书和 X/Twitter。Cookie 只临时传给本机 yt-dlp。</div>
<div class="section"><div class="label">当前视频保存目录</div><div class="path" id="downloadPath">正在读取…</div><div class="row"><button class="button secondary" id="chooseDirBtn">选择文件夹</button><button class="button light" id="resetDirBtn">恢复默认</button></div></div>
<button class="button secondary" id="pingBtn">检测本地组件</button>
<button class="button" id="downloadBtn">下载当前页面</button>
<div class="status" id="status">修改保存目录只影响之后的新下载，已经下载的文件不会移动。</div>
<script src="popup.js"></script></body></html>
